on: 
    push:
        branches: 
        - develop
    workflow_dispatch:
jobs:
   build:
     runs-on: ubuntu-latest
     steps:
     - uses: actions/checkout@v4
     - name: setup dotnet
       uses: actions/setup-dotnet@v4
       with: 
        dotnet-version: 9.0.x
     - name: restore the dependencies
       run: dotnet restore src/Presentation/Nop.Web/Nop.Web.csproj
     - name: compile the application
       run: dotnet build --configuration=Release src/Presentation/Nop.Web/Nop.Web.csproj --no-restore
     - name: test the application
       run: dotnet test src/Tests/Nop.Tests/Nop.Tests.csproj --logger "trx;LogFileName=testresults.trx"
     - name: Zip test logs
       run: zip -r test-logs.zip . -i testresults.trx
     - name: uplaod artifacts
       uses: actions/upload-artifact@v4
       with:
         name: test-logs.zip
         path: testresults.trx
     - name: publish the project
       run: dotnet publish src/Presentation/Nop.Web/Nop.Web.csproj --configuration Release --output published


        